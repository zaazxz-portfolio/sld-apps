# compose.yaml - Dev environment untuk PHP Native + SQLite
# Untuk jalankan: docker compose up -d

name: sld-apps

services:

  # -------------------------------------------------------
  # PHP + Apache
  # -------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: sld-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      DB_DRIVER: sqlite
      DB_SQLITE_PATH: ${DB_SQLITE_PATH:-/var/www/html/database.db}
    init: true
    command: >
      sh -c "chmod 666 /var/www/html/database.db 2>/dev/null;
             rm -f /var/www/html/database.db-wal /var/www/html/database.db-shm;
             apache2-foreground"

networks:
  sld-network:
    driver: bridge
