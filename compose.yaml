# compose.yaml - Dev environment untuk PHP Native + SQLite / MySQL
# Untuk jalankan: docker compose up -d
# Untuk MySQL:    docker compose --profile mysql up -d
# Untuk SQLite:   docker compose up -d  (tanpa profile mysql)

name: sld-apps

services:

  # -------------------------------------------------------
  # PHP + Apache (selalu aktif)
  # -------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: sld-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      # Mount source code langsung agar perubahan file langsung terasa (dev mode)
      - .:/var/www/html
      # Persist SQLite database di luar container
      - ./database.db:/var/www/html/database.db
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      DB_DRIVER: ${DB_DRIVER:-sqlite}
      # SQLite
      DB_SQLITE_PATH: ${DB_SQLITE_PATH:-/var/www/html/database.db}
      # MySQL (hanya dipakai jika DB_DRIVER=mysql)
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-sld_apps}
      DB_USER: ${DB_USER:-sld_user}
      DB_PASS: ${DB_PASS:-secret}
    depends_on:
      mysql:
        condition: service_healthy
        required: false   # opsional; hanya berlaku jika mysql aktif
    networks:
      - sld-network

  # -------------------------------------------------------
  # MySQL (aktif hanya dengan: --profile mysql)
  # -------------------------------------------------------
  mysql:
    image: mysql:8.4
    container_name: sld-mysql
    profiles:
      - mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: ${DB_NAME:-sld_apps}
      MYSQL_USER: ${DB_USER:-sld_user}
      MYSQL_PASSWORD: ${DB_PASS:-secret}
    ports:
      - "${MYSQL_PORT:-33062}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d  # SQL init scripts (opsional)
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=${MYSQL_ROOT_PASSWORD:-password}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - sld-network


volumes:
  mysql_data:
    driver: local

networks:
  sld-network:
    driver: bridge
