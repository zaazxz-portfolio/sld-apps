# compose.yaml - Dev environment untuk PHP Native + SQLite
# Untuk jalankan: docker compose up -d

name: sld-apps

services:

  # -------------------------------------------------------
  # PHP + Apache
  # -------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: sld-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      # Mount source code langsung agar perubahan file langsung terasa (dev mode)
      - .:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      DB_DRIVER: sqlite
      DB_SQLITE_PATH: ${DB_SQLITE_PATH:-/var/www/html/database.db}
