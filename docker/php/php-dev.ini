; PHP settings untuk development
; File ini di-load via Dockerfile ke /usr/local/etc/php/conf.d/php-dev.ini

[PHP]
; Tampilkan semua error saat dev
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On

; Timezone (sesuaikan jika perlu)
date.timezone = Asia/Jakarta

; Upload limits
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 120
memory_limit = 256M

; SQLite
sqlite3.extension_dir = /usr/local/lib/php/extensions

[opcache]
; Matikan opcache di dev agar perubahan file langsung terasa
opcache.enable = 0
opcache.enable_cli = 0
